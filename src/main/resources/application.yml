spring:
  application:
    name: testcontainers-java
  profiles:
    active: dev
  config:
    import: "configserver:http://localhost:8888"
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: true
      retry:
        initial-interval: 1000
        multiplier: 1.1
        max-attempts: 6

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: refresh,env